{{ define "main" }}
<section class="page-hero">
  <div class="container page-hero-inner">
    <div class="eyebrow light-eyebrow">AFRICAN AGRICULTURAL SCHOLARS RESEARCH FUND</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.intro }}
      <p>{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="content-section section-pad">
  <div class="container content-layout{{ if not .Params.sidebar }} content-layout-full{{ end }}">
    <article class="prose">
      {{ .Content }}
    </article>

    {{ if .Params.sidebar }}
      <aside class="content-aside">
        <div class="aside-mark">AASRF</div>
        <h3>Research with purpose.</h3>
        <p>{{ site.Params.tagline }}</p>
        <a class="text-link" href="{{ "contact/" | relURL }}">
          Get in touch <span>→</span>
        </a>
      </aside>
    {{ end }}
  </div>
</section>
{{ end }}
